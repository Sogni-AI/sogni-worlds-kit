    seen: "Wide eye-level shot at Hobbiton: a round doorway in a curved timber frame under a carved gable with a wooden finial, set into a grassy hillside; the red door stands open, swung inward at right, showing a dim wood-panelled hall. In front of it a man with short dark hair and a goatee in a grey t-shirt, dark jeans and boots, with a crossbody strap and a dark jacket over his arm, stands with a woman with a black bob in a sheer pink patterned top, a black pinafore dress, black boots and a large black tote bag on her shoulder; her arm is around his shoulders and her head leans against him; both smile at the camera. A lantern hangs at each side of the door; a stone wall with a round leaded window at far left; a painted green log at left; yellow marigolds and orange flowers at lower left; a wooden stool and a small red table with tools and a little yellow-roofed lamp at right; a stepping-stone path; pines, a hedge and a leafy branch above."
    narration:
      voice: mark
      lines:
        - Kia ora!
        - So this is Hobbiton, near Matamata, right near the end of our road trip.
        - Everything here is hobbit-sized, so mind your head.
