# The Long White Cloud — the real plan behind https://worlds.sogni.ai/demo/the-long-white-cloud

# Every film direction below is the exact text that rendered the film now live in that world
# (MiniMax H3 FastH3 first-and-last-frame, two-stage 2K, 1152x768 canvas delivered at 2304x1536),
# with the seed it used. `node world lint-examples` checks it; the kit rebuilds each prompt
# byte for byte from `action` and `sound`.

# What is NOT in this repository:
#   - the stills: they are Mark’s own photographs. The playable copy of this world
#     (examples/the-long-white-cloud/world.json) streams them and the films from Sogni’s CDN.
#   - the voice recordings the narration was cloned from, and the two keyframe stills of
#     "Say hello" (paths are listed so the plan reads as it was built).
#   - the music: the live world plays a commercial recording, so `music` is null here.

# Use it as a worked example of seen / loop / objects / select / film, then make your own
# with `node world new <id>`.

id: the-long-white-cloud
title: The Long White Cloud
subtitle: A trip through Aotearoa New Zealand
story: A road trip through New Zealand in March and April 2023, told in twenty-two of Mark’s own photographs, each one quietly alive. Every way on is carried by something in the picture — a door, a guitar, a helicopter, a breath on the lens — and where the trip jumps a thousand kilometres, the camera passes through a doorway, a cloud, a water surface or a reflection to get there. Mark narrates each place like a phone call home; Jen joins in where she is in the picture.
order: linear
start: round-door
canvas: 1152x768
contentFilter: off
voices:
  mark:
    clone: voices/mark.m4a
    transcript: Mark’s own 22.8-second recording and his transcript of it (not included).
  jen:
    clone: voices/jen.m4a
    transcript: Jen’s own 15.6-second recording and her transcript of it (not included).
music: null
