# The Dream Thread — the real plan behind https://worlds.sogni.ai/demo

# A world with no photographs in it. Every place was painted from a concept: Krea 2 Turbo for the
# first picture, then Sogni Krea 2 Identity Edit to keep the same character from one reference
# picture of Simon (the model and seed are noted on each place). The pictures are not in this
# repository; the playable copy (examples/the-dream-thread/world.json) streams them, the films, the rewinds
# and the 3D figures from where they are published.

# Every film direction below is the shot and soundscape that rendered the film now live in that
# world (MiniMax H3 FastH3 first-and-last-frame, two-stage, 1344x768 delivered at 2688x1536), with
# its seed. 11 of the 57 films were written for the kit's prompt format and
# `node world render` rebuilds their prompts byte for byte; the rest were directed before the kit
# existed, under an earlier form of the same recipe (the alignment line rounds differently, the
# landing sentence is phrased in the direction itself, and 25 of them asked for music), so
# a re-render from this plan would be the same direction, not the same bytes. Where a direction
# breaks a rule the kit learned later, the film says so with `allow` and lint still shows the warning.

# Not in this plan, because the kit's format has no place for it: the world's regional score
# (twelve MiniMax Music 3 cues), the rendered ways back through a recurring object, an object
# that leads two ways, and the sheets of questions Simon can ask. Simon's thirteen figures are:
# `collect` objects without a film, picked up straight from the picture.

# Use it as a worked example of a free-roaming world: seen / objects / select / film, with
# `order: free` and an intro card. Then make your own with `node world new <id>`.

id: the-dream-thread
title: The Dream Thread
subtitle: A pink sloth, a sleeping giant, and absolutely no itinerary
story: "Simon, a small pink sloth with reading glasses and a horn nobody in the story brings up, wakes at a moonlit crossroads below a sleeping stone giant. Twenty-three places, each painted in its own look (moonlit fantasy, cut paper, risograph ink, neon rain, watercolour, stop-motion clay), joined by the things he can climb, open, ride or follow: every journey is one continuous shot through the thing you clicked, and it lands exactly on the next picture. Simon is somewhere in every place, and in thirteen of them he can be picked up and turned over. Nobody in it is real."
order: free
start: junction
canvas: 1344x768
contentFilter: off
intro:
  eyebrow: Story adventure · 23 places
  tagline: Wander 23 hand-built places, take every journey between them, and collect the figures hiding along the way.
  begin: Begin the story
voices: {}
music: null
places:
