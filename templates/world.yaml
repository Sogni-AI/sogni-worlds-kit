# The plan for one Sogni World. Your agent fills this in; you approve it.
# Reference: docs/world-yaml.md   Craft rules: docs/directing-films.md
# `node world lint` checks it. `node world next` says what to do now.

id: __ID__
title: __TITLE__
subtitle: ""
# One paragraph: what this world is, its tone, who is in it.
story: ""

# linear: a story told in order; each place offers the way to the next one first,
# and any other crossing is labelled a shortcut. free: every way is equal.
order: linear

# The first place. `ingest` sets it to the first photo if left empty.
start: ""

# Every place shares one canvas; `ingest` picks it from your photos.
# 3:2 is 1152x768 (films arrive as 2304x1536), 16:9 is 1344x768, and so on.
canvas: ""

# Sogni's safe-content filter on generated films: on or off.
contentFilter: off

# Optional voices for narration. Clone only a voice you own or have permission to use.
voices: {}
#  narrator:
#    clone: voices/narrator.m4a         # 10–30 s of clean speech
#    transcript: "Exactly what is said in the recording."
#  guide:
#    design: "A warm, unhurried woman in her forties, close to the microphone."

# Optional music under the whole world.
music: null
#  prompt: "Gentle fingerpicked acoustic guitar and soft strings, warm and unhurried, loops cleanly"
#  seconds: 120
# or, only for music you have the rights to:
#  file: music/my-song.mp3
#  credit: "Song title — Artist"

# One entry per photograph, in story order. `ingest` adds them from photos/.
